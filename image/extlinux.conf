# pid351. One kernel with the whole userspace inside it, one device tree.
#
# console order matters: the last console= is the one /dev/console maps to,
# and that is where our stdout lands. tty0 goes last so a boot that fails
# before we ever open DRM still prints on the panel - it is the only console
# this machine has, since there is no accessible UART.
#
# quiet stops the console at KERN_ERR, which is the whole of the visible boot:
# three hundred and seventy lines of the kernel introducing itself, sideways,
# in forty columns, before the game appears. None of it was ever read off the
# glass - it is read out of pid351-boot.log afterwards, and quiet does not
# touch what reaches the log, only what reaches the panel. A panic is
# KERN_EMERG and still prints, which is the one thing the console is for.
#
# Our own diagnostics land in /dev/kmsg at KERN_WARNING, so they go quiet with
# everything else, and the failure paths that must survive raise themselves to
# KERN_ERR by hand. That is deliberate: a running game should not be able to
# scribble on its own screen, and until now every five-second telemetry line
# was queued up in the console waiting to be flushed over the picture the
# moment we dropped the display.
#
# vt.global_cursor_default=0 because a blinking underscore in the corner of a
# handheld is not a thing any console has ever done.
#
# panic=5 rather than 1: long enough to read what went wrong off the screen,
# short enough that a bad image is not a hang.
#
# printk.devkmsg=on because /dev/kmsg otherwise rate limits our own output to
# ten lines per five seconds and drops the rest silently. Our stdout goes
# there, so the default cost us four rows of the blit table and most of a
# diagnostic census without ever saying it had.
#
# cma=16M for bring-up. We need about 1.5 MB (two 480x320 dumb buffers plus
# the fbdev emulation one) and ROCKNIX reserves 64 MB. Trimming it to the
# measured minimum is a job for after it boots, not before.
DEFAULT pid351
TIMEOUT 0

LABEL pid351
  LINUX /pid351/Image
  FDT /pid351/pid351-rg351p.dtb
  APPEND console=ttyS2,1500000 console=tty0 quiet vt.global_cursor_default=0 fbcon=rotate:3 panic=5 cma=16M printk.devkmsg=on
